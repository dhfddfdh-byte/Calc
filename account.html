<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Calc</title><link rel="stylesheet" href="./src/v2/scout.css"><script type="module" src="./src/v2/account-page.mjs"></script></head><body><main><header><div><h1>Your account</h1><p>Private inventory and settings backup</p></div><a href="./index.html">Back to calculator</a></header><section><h2>Sign in or create an account</h2><p id="status" role="status">Checking backend configuration…</p><form id="auth"><label>Email <input id="email" type="email" autocomplete="email" required></label><p><label>Password <input id="password" type="password" autocomplete="current-password" minlength="8" required></label></p><button id="login" type="submit" disabled>Sign in</button> <button id="signup" type="button" disabled>Create account</button></form><div id="session" hidden><p id="identity"></p><button id="logout">Sign out</button></div></section><section><h2>Cloud state</h2><p>Saving uploads your current local calculator data. Restoring replaces it only after confirmation. No third-party website credentials are stored.</p><button id="save" disabled>Save current device</button> <button id="restore" disabled>Restore cloud backup</button><p id="syncStatus" role="status"></p></section></main></body></html>
